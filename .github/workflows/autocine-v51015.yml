name: LoL AutoCine v5.10.15 Windows/Codex ZIP

on:
  push:
    branches:
      - 'autocine/v5.10.15-ux-camera-fixes'
  workflow_dispatch:

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r LoL_AutoCine/requirements.txt pytest
      - name: Compile
        run: |
          python -m compileall -q LoL_AutoCine
      - name: v5.10.15 UI, camera and previous regressions
        working-directory: LoL_AutoCine
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_v51015_ux_camera.py \
            tests/test_v51014_studio_nle.py \
            tests/test_v51013_player_filter.py \
            tests/test_v51011_gallery_camera_qa.py \
            tests/test_editor_ui_contract.py \
            tests/test_feature_preservation.py \
            tests/test_v5106_hover_help.py
      - name: Build and verify ZIPs
        run: python LoL_AutoCine/tools/package_v51015.py
      - name: Windows full ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LoL-AutoCine-v5.10.15-Windows-Full
          path: builds/v5.10.15/*Windows_Full.zip
          retention-days: 30
      - name: Codex merge ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LoL-AutoCine-v5.10.15-Codex-MergeChanges
          path: builds/v5.10.15/*Codex_MergeChanges.zip
          retention-days: 30
