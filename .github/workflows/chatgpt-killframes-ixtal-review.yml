name: ChatGPT Ixtal Transparent Review
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chatgpt-killframes-ixtal-review.yml"
      - "LoL_AutoCine/assets/kill_frames_chatgpt/build_ixtal_review.py"
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ChatGPT asset work branch
        uses: actions/checkout@v4
        with:
          path: output
      - name: Checkout source images only
        uses: actions/checkout@v4
        with:
          ref: codex/killframes-all-89-candidates-20261014
          path: original
      - name: Python dependencies
        run: python -m pip install --quiet "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Render Ixtal weak and strong RGBA reference-guided PNGs
        shell: bash
        run: |
          python output/LoL_AutoCine/assets/kill_frames_chatgpt/build_ixtal_review.py original/LoL_AutoCine/assets/kill_concepts output/LoL_AutoCine/assets/kill_frames_chatgpt/review/IXTAL
      - name: Commit review images to ChatGPT-only directory
        working-directory: output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LoL_AutoCine/assets/kill_frames_chatgpt/review/IXTAL/
          if ! git diff --cached --quiet; then
            git commit -m "assets(chatgpt): Ixtal weak/strong alpha review assets (not final)"
            git push
          fi
