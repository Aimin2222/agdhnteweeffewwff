name: ChatGPT Bandle City Transparent Review
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chatgpt-killframes-bandle-city-review.yml"
      - "LoL_AutoCine/assets/kill_frames_chatgpt/build_bandle_city_review.py"
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ChatGPT asset workspace
        uses: actions/checkout@v4
        with:
          path: output
      - name: Checkout verified original sources (read only)
        uses: actions/checkout@v4
        with:
          ref: codex/killframes-all-89-candidates-20261014
          path: original
      - name: Install Pillow and NumPy
        run: python -m pip install --quiet "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Produce six original-inspired transparent RGBA sprites
        shell: bash
        run: |
          python output/LoL_AutoCine/assets/kill_frames_chatgpt/build_bandle_city_review.py original/LoL_AutoCine/assets/kill_concepts output/LoL_AutoCine/assets/kill_frames_chatgpt/review/BANDLE_CITY
      - name: Save PNGs and quality comparisons to separate ChatGPT path
        working-directory: output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LoL_AutoCine/assets/kill_frames_chatgpt/review/BANDLE_CITY/
          if ! git diff --cached --quiet; then
            git commit -m "assets(chatgpt): Bandle City six high-res transparent QA sprites"
            git push
          fi
