<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AutoCine 動くエフェクト35種類</title><style>*{box-sizing:border-box}body{background:#151c29;color:#eee;font:16px sans-serif;margin:18px}header{position:sticky;top:0;z-index:5;background:#151c29f2;padding:10px}h1{font-size:25px}button,input,select,a.link{padding:9px;margin:3px;border-radius:5px}a{color:#8ed2ff}video{width:100%;max-height:73vh;background:#000}#view{max-width:1280px;margin:auto}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:22px 0}.card{border:1px solid #56647a;border-radius:8px;padding:10px;cursor:pointer}.card img{width:100%}.active{border:3px solid #7bcafa}.meta{color:#b9c8dc}#alpha{max-width:100%;background:repeating-conic-gradient(#303b48 0% 25%,#536071 0% 50%) 50%/24px 24px}</style><header><h1>動くエフェクト 35種類</h1><p>元フレーム・単体・重ねた動きを動画で確認できます。追加ソフトや通信は不要です。</p><input id="search" placeholder="テーマ名で探す"><button id="prev">前へ</button><button id="next">次へ</button><label><input id="auto" type="checkbox" checked>順番に自動再生（OFFで同じ案を繰り返す）</label><select id="speed"><option value="1">通常速度</option><option value="0.5">半分の速度</option><option value="0.25">4分の1の速度</option></select><button id="save">選択結果を保存</button></header><main><div id="view"><h2 id="name"></h2><video id="video" controls playsinline></video><p><button data-choice="採用候補">採用候補</button><button data-choice="要修正">要修正</button><button data-choice="不採用">不採用</button><b id="choice"></b></p><p><a id="alphaLink" href="#">透過付きの動く見本を開く</a> ／ <a id="specLink" href="#">動きの仕様</a></p><p class="meta">本体への組み込み前の確認版です。動画中の背景・説明文字は確認用で、透過付きの見本には入りません。</p></div><div id="cards"></div></main><script>const items=[{"id": "A", "label": "シンプル", "mode": "minimal", "video": "A/comparison.mp4", "alpha": "A/effect_alpha.webp", "poster": "A/poster.jpg", "spec": "A/motion.json"}, {"id": "B", "label": "高級感", "mode": "glint", "video": "B/comparison.mp4", "alpha": "B/effect_alpha.webp", "poster" lossom", "label": "スピリットブロッサム", "mode": "petal", "video": "D_spirit_blossom/comparison.mp4", "alpha": "D_spirit_blossom/effect_alpha.webp", "poster": "D_spirit_blossom/poster.jpg", "spec": "D_spirit_blossom/motion.json"}, {"id": "D_star_guardian", "label": "スターガーディアン", "mode": "star", "video": "D_star_guardian/comparison.mp4", "alpha": "D_star_guardian/effect_alpha.webp", "poster": "D_star_guardian/poster.jpg", "spec": "D_star_guardian/motion.json"}, {"id": "D_steel_valkyries", "label": "Steel Valkyries", "mode": "lock", "video": "D_steel_valkyries/comparison.mp4", "alpha": "D_steel_valkyries/effect_alpha.webp", "poster": "D_steel_valkyries/poster.jpg", "spec": "D_steel_valkyries/motion.json"}, {"id": "D_warring_kingdoms", "label": "覇王", "mode": "slash", "video": "D_warring_kingdoms/comparison.mp4", "alpha": "D_warring_kingdoms/effect_alpha.webp", "poster": "D_warring_kingdoms/poster.jpg", "spec": "D_warring_kingdoms/motion.json"}, {"id": "D_winter_festival", "label": "冬の祝祭", "mode": "snow", "video": "D_winter_festival/comparison.mp4", "alpha": "D_winter_festival/effect_alpha.webp", "poster": "D_winter_festival/poster.jpg", "spec": "D_winter_festival/motion.json"}];let index=0,choices={};const key='autocine-motion-v3';try{choices=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const $=id=>document.getElementById(id);function draw(){let q=$('search').value.toLowerCase();$('cards').innerHTML=items.map((a,i)=>({...a,i})).filter(a=>(a.id+' '+a.label).toLowerCase().includes(q)).map(a=>`<div class="card ${a.i===index?'active':''}" data-index="${a.i}"><img loading="lazy" src="${a.poster}"><b>${a.label}</b><p>${choices[a.id]||'未選択'}</p></div>`).join('')}function show(i,play=true){index=(i+items.length)%items.length;const a=items[index];$('name').textContent=(index+1)+'/35 '+a.label;$('video').src=a.video;$('video').poster=a.poster;$('video').playbackRate=Number($('speed').value);$('alphaLink').href=a.alpha;$('specLink').href=a.spec;$('choice').textContent=choices[a.id]||'未選択';draw();if(play)$('video').play().catch(()=>{})}$('cards').onclick=e=>{let c=e.target.closest('[data-index]');if(c){show(Number(c.dataset.index));$('view').scrollIntoView({behavior:'smooth'})}};$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('video').onended=()=>{if($('auto').checked)show(index+1);else{$('video').currentTime=0;$('video').play().catch(()=>{})}};$('speed').onchange=()=>{$('video').playbackRate=Number($('speed').value)};$('search').oninput=draw;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choices[items[index].id]=b.dataset.choice;try{localStorage.setItem(key,JSON.stringify(choices))}catch(e){};$('choice').textContent=b.dataset.choice;draw()});$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({version:3,choices},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='動くエフェクト_選択結果.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};show(0,false);</script></html>
